name: LunaTranscribe
options:
  bundleIdPrefix: com.maximhofmeister
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.15.7"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "3.1.0"
  # On-Device-LLM für die Diktat-Nachbearbeitung (Refine/): Qwen3 + LFM2 über Metal.
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples.git
    from: "2.29.1"
  # Gemeinsamer Kern von App und luna-mcp (Datenmodell, Bibliothek, Suchindex, MCP-Server). Testbar mit `swift test`.
  LunaCore:
    path: Packages/LunaCore

targets:
  LunaTranscribe:
    type: application
    platform: macOS
    sources:
      - path: LunaTranscribe
        excludes:
          - "Info.plist"
      # MediaRemoteAdapter-Skript → Contents/Resources (wird von /usr/bin/perl ausgeführt)
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
    info:
      path: LunaTranscribe/Info.plist
      properties:
        CFBundleDisplayName: LunaTranscribe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true                      # Nur Menüleiste, kein Dock-Icon
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "LunaTranscribe nimmt deine Stimme auf, um sie lokal auf diesem Mac in Text umzuwandeln. Es wird nichts hochgeladen."
        NSAudioCaptureUsageDescription: "Im Meeting-Modus nimmt LunaTranscribe zusätzlich die Systemwiedergabe (z. B. Zoom, Teams) auf, um das Gespräch lokal zu transkribieren. Es wird nichts hochgeladen."
        NSHumanReadableCopyright: "© 2026 Maximilian Hofmeister"
    # Signatur (Team) kommt aus Config/Signing.xcconfig bzw. der lokalen Config/Local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: LunaTranscribe/LunaTranscribe.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Kein App-Sandbox: nötig für globale Hotkeys + Einfügen per ⌘V in andere Apps.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_NAME: LunaTranscribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # FoundationModels gibt es erst ab macOS 26; Deployment-Target bleibt 15 → nur schwach linken.
        OTHER_LDFLAGS: -weak_framework FoundationModels
    dependencies:
      - package: FluidAudio
      - package: KeyboardShortcuts
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      # Embedding-Modell für die inhaltliche Suche (Search/MLXTextEmbedder, auch in luna-mcp).
      - package: MLXSwiftExamples
        product: MLXEmbedders
      - package: LunaCore
        product: LunaCore
      # MCP-Server für Claude: liegt als eigenes Programm in Contents/MacOS/luna-mcp.
      - target: luna-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Wird nicht gelinkt, nur eingebettet + signiert; perl lädt es zur Laufzeit.
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true

  # MCP-Server (stdio) für Claude Code / Claude Desktop. Startet ohne die App; liest die Meeting-Bibliothek,
  # den Suchindex und die Einstellungen der App. Siehe docs/MCP-Server-Plan.md.
  luna-mcp:
    type: tool
    platform: macOS
    sources:
      - path: LunaMCP
      # Dasselbe Embedding-Modell wie die App (Anfragen müssen im selben Vektorraum liegen wie der Index).
      - path: LunaTranscribe/Search/MLXTextEmbedder.swift
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: luna-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.maximhofmeister.LunaTranscribe.mcp
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: true
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        SKIP_INSTALL: true
    dependencies:
      - package: LunaCore
        product: LunaCore
      - package: LunaCore
        product: LunaMCPServer
      - package: MLXSwiftExamples
        product: MLXEmbedders

schemes:
  LunaTranscribe:
    build:
      targets:
        LunaTranscribe: all
    run:
      # Release: FluidAudio (Mel-Spektrogramm, Decoder-Schleife) ist im Debug-Build spürbar langsamer.
      config: Release
    archive:
      config: Release
